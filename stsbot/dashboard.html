<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StsBot Dashboard</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1f1d1a; --muted: #6b665d; --line: #e3ded4;
    --accent: #b8432f; --accent-ink: #ffffff; --ok: #2f7d4f; --off: #8a8378; --warn: #a86a12;
    --code: #f1ede5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --panel: #211f24; --ink: #ece8e1; --muted: #a39d93; --line: #34313a;
      --accent: #e0644c; --accent-ink: #1b1110; --ok: #5cbf86; --off: #8d877e; --warn: #e0a24a;
      --code: #1b1a1e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17161a; --panel: #211f24; --ink: #ece8e1; --muted: #a39d93; --line: #34313a;
    --accent: #e0644c; --accent-ink: #1b1110; --ok: #5cbf86; --off: #8d877e; --warn: #e0a24a;
    --code: #1b1a1e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #fff; background: var(--off); }
  .pill.on { background: var(--ok); }
  main { display: grid; gap: 16px; padding: 16px 20px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); max-width: 1300px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: var(--code); border-radius: 8px; padding: 8px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--code); color: var(--ink); border-radius: 8px;
           padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  label { display: flex; gap: 8px; align-items: center; }
  input[type=number] { width: 80px; font: inherit; padding: 6px; border-radius: 6px; border: 1px solid var(--line);
                       background: var(--code); color: var(--ink); }
  pre { background: var(--code); border-radius: 8px; padding: 10px; margin: 0; max-height: 360px; overflow: auto;
        font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .deck { display: flex; flex-wrap: wrap; gap: 6px; }
  .deck span { background: var(--code); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .pic { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code); }
  .pic img { width: 100%; height: 130px; object-fit: cover; display: block; }
  .pic div { padding: 6px 8px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pic button { width: calc(100% - 16px); margin: 0 8px 8px; }
  .wide { grid-column: 1 / -1; }
  #msg { color: var(--warn); font-size: 13px; min-height: 1.2em; }
</style>
</head>
<body>
<header>
  <h1>StsBot</h1>
  <span id="state" class="pill">…</span>
  <span id="msg"></span>
</header>
<main>
  <section>
    <h2>Run</h2>
    <div class="stats">
      <div class="stat"><b id="hp">–</b><span>HP</span></div>
      <div class="stat"><b id="floor">–</b><span>Floor</span></div>
      <div class="stat"><b id="asc">–</b><span>Ascension</span></div>
      <div class="stat"><b id="gold">–</b><span>Gold</span></div>
    </div>
    <p class="muted" id="build"></p>
    <div class="deck" id="deck"></div>
  </section>

  <section>
    <h2>Bot</h2>
    <div class="row">
      <button class="primary" id="start">Start</button>
      <button id="stop">Stop</button>
    </div>
    <h2 style="margin-top:14px">Settings</h2>
    <div class="row"><label><input type="checkbox" id="draw"> Draw a picture on each act's map</label></div>
    <div class="row"><label>Resume after the mouse is still for <input type="number" id="still" min="1" step="1"> s</label></div>
    <div class="row"><label>New runs to start <input type="number" id="runs" min="0" step="1"></label>
      <span class="muted">(0 = keep going)</span></div>
    <div class="row"><button id="save">Save settings</button><span class="muted" id="saved"></span></div>
    <p class="muted">Settings apply the next time the bot starts.</p>
  </section>

  <section class="wide">
    <h2>Images</h2>
    <div class="row">
      <button class="primary" id="random">Draw random</button>
      <span class="muted">Draws on the map (opens it if needed). A running bot is stopped for it and started again.</span>
    </div>
    <div class="gallery" id="gallery"></div>
    <p class="muted" id="noimages" hidden>No pictures yet: put png or jpg files in C:\stsbot\images.</p>
  </section>

  <section class="wide">
    <h2>Log</h2>
    <pre id="log"></pre>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let settingsLoaded = false, busy = "";

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"},
                                                      body: JSON.stringify(body)});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

async function refresh() {
  try {
    const s = await api("/api/status");
    $("state").textContent = s.running ? "Running" : "Stopped";
    $("state").className = "pill" + (s.running ? " on" : "");
    $("hp").textContent = s.max_hp ? `${s.hp}/${s.max_hp}` : "–";
    $("floor").textContent = s.floor || "–";
    $("asc").textContent = "A" + (s.ascension ?? 0);
    $("gold").textContent = s.gold || "–";
    $("build").textContent = `${s.deck.length} cards · ${s.build}`;
    $("deck").innerHTML = s.deck.map(n => `<span>${n.replace(/[<>&]/g, "")}</span>`).join("");
    $("log").textContent = s.log.join("\n");
    $("log").scrollTop = $("log").scrollHeight;
    $("msg").textContent = s.busy ? `${s.busy}: ${s.message}` : s.message;
    busy = s.busy;
    document.querySelectorAll(".drawbtn, #random").forEach(b => b.disabled = !!busy);
    $("start").disabled = s.running; $("stop").disabled = !s.running;
    if (!settingsLoaded) {
      $("draw").checked = !!s.settings.draw; $("still").value = s.settings.still; $("runs").value = s.settings.runs || 0;
      settingsLoaded = true;
    }
  } catch (e) { $("msg").textContent = "dashboard: " + e.message; }
}

async function loadImages() {
  const names = await api("/api/images");
  $("noimages").hidden = names.length > 0;
  $("gallery").innerHTML = names.map(n => {
    const safe = n.replace(/[<>&"]/g, "");
    return `<div class="pic"><img src="/images/${encodeURIComponent(n)}" alt=""><div title="${safe}">${safe}</div>
            <button class="drawbtn" data-name="${safe}">Draw now</button></div>`;
  }).join("");
  document.querySelectorAll(".drawbtn").forEach(b => b.onclick = () => draw(b.dataset.name));
}

async function draw(name) {
  try { await api("/api/draw", {name}); $("msg").textContent = "drawing…"; } catch (e) { $("msg").textContent = e.message; }
  refresh();
}

$("start").onclick = async () => { await api("/api/start", {}); setTimeout(refresh, 1500); };
$("stop").onclick = async () => { await api("/api/stop", {}); refresh(); };
$("random").onclick = () => draw(null);
$("save").onclick = async () => {
  const runs = parseInt($("runs").value || "0", 10);
  await api("/api/settings", {draw: $("draw").checked, still: parseFloat($("still").value || "5"), runs: runs > 0 ? runs : null});
  $("saved").textContent = "saved"; setTimeout(() => $("saved").textContent = "", 2000);
};

refresh(); loadImages();
setInterval(refresh, 2500);
</script>
</body>
</html>
